<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrendLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12l4-5 3 3 4-7 3 4' stroke='%232a78d6' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#/" aria-label="TrendLab home">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 12l4-5 3 3 4-7 3 4" /></svg>
      <span>TrendLab</span>
    </a>
    <div class="search-field">
      <input id="search" type="search" placeholder="Search stocks, indices and mutual funds"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest"
             aria-autocomplete="list" aria-label="Search stocks, indices and mutual funds" />
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch between light and dark">◐</button>
  </div>
</header>

<div id="demo-banner" class="demo-banner" role="status" hidden>
  <div class="demo-inner">
    <strong>Demo mode.</strong>
    <span>These prices are made up, not real market data.</span>
    <button id="demo-off" class="link-btn" type="button">Show live prices</button>
  </div>
</div>

<main id="view" class="wrap" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>TrendLab is a research tool, not financial advice. It cannot buy or sell anything.
    Prices may be delayed, and past patterns do not predict future prices.</p>
    <label class="toggle">
      <input type="checkbox" id="demo-toggle" />
      <span>Demo data <span class="muted">— works offline, prices are made up</span></span>
    </label>
  </div>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
